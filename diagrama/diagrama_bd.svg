<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420" font-family="Segoe UI, Arial, sans-serif">
  <title>MythosReservasDB - Diagrama entidad-relación</title>
  <style>
    .caja { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.5; }
    .cabecera { fill: #1f3a5f; }
    .titulo-tabla { fill: #ffffff; font-size: 16px; font-weight: 600; }
    .fila-par { fill: #f3f6fa; }
    .columna { fill: #1b1b1b; font-size: 13px; }
    .tipo { fill: #5a6573; font-size: 12px; }
    .pk { fill: #b7791f; }
    .fk { fill: #2b6cb0; }
    .uk { fill: #2f855a; }
    .insignia { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .relacion { fill: none; stroke: #1f3a5f; stroke-width: 1.6; }
    .cardinalidad { fill: #1f3a5f; font-size: 13px; font-weight: 700; }
    .encabezado { fill: #1f3a5f; font-size: 20px; font-weight: 700; }
    .subtitulo { fill: #5a6573; font-size: 13px; }
    .leyenda { fill: #3d4752; font-size: 12px; }
  </style>

  <rect width="1060" height="420" fill="#ffffff"/>
  <text x="30" y="36" class="encabezado">MythosReservasDB · Diagrama entidad-relación</text>
  <text x="30" y="58" class="subtitulo">Mythos Coworking · SQL Server · Tercera Forma Normal (3FN)</text>

  <!-- ============ USUARIOS ============ -->
  <g transform="translate(30,80)">
    <rect class="caja" width="300" height="164" rx="6"/>
    <path class="cabecera" d="M6,0 H294 A6,6 0 0 1 300,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Usuarios</text>
    <rect class="fila-par" x="1" y="68" width="298" height="28"/>
    <rect class="fila-par" x="1" y="124" width="298" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">codigo</text><text x="290" y="19" class="tipo" text-anchor="end">UNIQUEIDENTIFIER</text>
    </g>
    <g transform="translate(0,68)">
      <text x="42" y="19" class="columna">nombres</text><text x="290" y="19" class="tipo" text-anchor="end">NVARCHAR(100)</text>
    </g>
    <g transform="translate(0,96)">
      <rect class="uk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">UK</text>
      <text x="42" y="19" class="columna">correo</text><text x="290" y="19" class="tipo" text-anchor="end">NVARCHAR(150)</text>
    </g>
    <g transform="translate(0,124)">
      <text x="42" y="19" class="columna">fechaCreacion</text><text x="290" y="19" class="tipo" text-anchor="end">DATETIME2(0)</text>
    </g>
  </g>

  <!-- ============ RESERVAS ============ -->
  <g transform="translate(380,80)">
    <rect class="caja" width="300" height="220" rx="6"/>
    <path class="cabecera" d="M6,0 H294 A6,6 0 0 1 300,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Reservas</text>
    <rect class="fila-par" x="1" y="68" width="298" height="28"/>
    <rect class="fila-par" x="1" y="124" width="298" height="28"/>
    <rect class="fila-par" x="1" y="180" width="298" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">codigo</text><text x="290" y="19" class="tipo" text-anchor="end">UNIQUEIDENTIFIER</text>
    </g>
    <g transform="translate(0,68)">
      <rect class="fk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">FK</text>
      <text x="42" y="19" class="columna">codigoSala</text><text x="290" y="19" class="tipo" text-anchor="end">UNIQUEIDENTIFIER</text>
    </g>
    <g transform="translate(0,96)">
      <rect class="fk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">FK</text>
      <text x="42" y="19" class="columna">codigoUsuario</text><text x="290" y="19" class="tipo" text-anchor="end">UNIQUEIDENTIFIER</text>
    </g>
    <g transform="translate(0,124)">
      <text x="42" y="19" class="columna">fechaInicio</text><text x="290" y="19" class="tipo" text-anchor="end">DATETIME2(0) UTC</text>
    </g>
    <g transform="translate(0,152)">
      <text x="42" y="19" class="columna">fechaFin</text><text x="290" y="19" class="tipo" text-anchor="end">DATETIME2(0) UTC</text>
    </g>
    <g transform="translate(0,180)">
      <text x="42" y="19" class="columna">fechaCreacion</text><text x="290" y="19" class="tipo" text-anchor="end">DATETIME2(0)</text>
    </g>
  </g>

  <!-- ============ SALAS ============ -->
  <g transform="translate(730,80)">
    <rect class="caja" width="300" height="164" rx="6"/>
    <path class="cabecera" d="M6,0 H294 A6,6 0 0 1 300,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Salas</text>
    <rect class="fila-par" x="1" y="68" width="298" height="28"/>
    <rect class="fila-par" x="1" y="124" width="298" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">codigo</text><text x="290" y="19" class="tipo" text-anchor="end">UNIQUEIDENTIFIER</text>
    </g>
    <g transform="translate(0,68)">
      <rect class="uk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">UK</text>
      <text x="42" y="19" class="columna">nombre</text><text x="290" y="19" class="tipo" text-anchor="end">NVARCHAR(100)</text>
    </g>
    <g transform="translate(0,96)">
      <text x="42" y="19" class="columna">capacidad</text><text x="290" y="19" class="tipo" text-anchor="end">INT (1..500)</text>
    </g>
    <g transform="translate(0,124)">
      <text x="42" y="19" class="columna">fechaCreacion</text><text x="290" y="19" class="tipo" text-anchor="end">DATETIME2(0)</text>
    </g>
  </g>

  <!-- ============ RELACIONES (1 a muchos) ============ -->
  <!-- Usuarios.codigo 1 -> N Reservas.codigoUsuario -->
  <path class="relacion" d="M330,134 H355 V190 H380"/>
  <path class="relacion" d="M338,126 V142"/>
  <path class="relacion" d="M368,190 L380,182 M368,190 L380,198"/>
  <text x="336" y="122" class="cardinalidad">1</text>
  <text x="366" y="180" class="cardinalidad">N</text>

  <!-- Salas.codigo 1 -> N Reservas.codigoSala -->
  <path class="relacion" d="M730,134 H705 V162 H680"/>
  <path class="relacion" d="M722,126 V142"/>
  <path class="relacion" d="M692,162 L680,154 M692,162 L680,170"/>
  <text x="718" y="122" class="cardinalidad">1</text>
  <text x="684" y="152" class="cardinalidad">N</text>

  <!-- ============ LEYENDA ============ -->
  <g transform="translate(30,330)">
    <rect class="pk" x="0" y="0" width="24" height="14" rx="3"/><text x="12" y="11" class="insignia" text-anchor="middle">PK</text>
    <text x="32" y="12" class="leyenda">Clave primaria (NEWSEQUENTIALID)</text>
    <rect class="fk" x="250" y="0" width="24" height="14" rx="3"/><text x="262" y="11" class="insignia" text-anchor="middle">FK</text>
    <text x="282" y="12" class="leyenda">Clave foránea (ON DELETE NO ACTION)</text>
    <rect class="uk" x="530" y="0" width="24" height="14" rx="3"/><text x="542" y="11" class="insignia" text-anchor="middle">UK</text>
    <text x="562" y="12" class="leyenda">Restricción UNIQUE</text>
    <text x="700" y="12" class="leyenda">1 ── N : una fila se relaciona con muchas</text>
    <text x="0" y="44" class="leyenda">CHECK: capacidad 1..500, fechaFin &gt; fechaInicio, correo y textos no vacíos · Procedimientos: dbo.RegistrarReserva, dbo.ActualizarReserva</text>
    <text x="0" y="66" class="leyenda">Vista: dbo.vw_ReservasDetalle (reserva + nombre de la sala + nombre del usuario)</text>
  </g>
</svg>
